name: garuda-airspace
services:
  postgres:
    platform: linux/amd64
    build: {context: ../.., dockerfile: infra/airspace/postgres/Dockerfile}
    environment:
      POSTGRES_USER: ${AIRSPACE_PG_USER:-garuda}
      POSTGRES_PASSWORD: ${AIRSPACE_PG_PASSWORD:-garuda-airspace-local-only}
      POSTGRES_DB: ${AIRSPACE_PG_DATABASE:-garuda_airspace}
      AIRSPACE_READER_USER: ${AIRSPACE_READER_USER:-garuda_airspace_reader_login}
      AIRSPACE_READER_PASSWORD: ${AIRSPACE_READER_PASSWORD:-change-this-reader-password}
    command: [postgres, -c, shared_preload_libraries=timescaledb]
    ports: ["127.0.0.1:${AIRSPACE_PG_PORT:-35432}:5432"]
    volumes: [postgres-data:/home/postgres/pgdata/data]
    healthcheck: {test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'], interval: 5s, timeout: 5s, retries: 30, start_period: 30s}
  redis:
    platform: linux/amd64
    build: {context: ../.., dockerfile: infra/airspace/redis/Dockerfile}
    command: [redis-server, /usr/local/etc/redis/redis.conf, --requirepass, "${AIRSPACE_REDIS_PASSWORD:-garuda-airspace-redis-local-only}"]
    environment: {REDISCLI_AUTH: "${AIRSPACE_REDIS_PASSWORD:-garuda-airspace-redis-local-only}"}
    ports: ["127.0.0.1:${AIRSPACE_REDIS_PORT:-36379}:6379"]
    volumes: [redis-data:/data]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 5s, timeout: 5s, retries: 30}
  neo4j:
    platform: linux/amd64
    build: {context: ../.., dockerfile: infra/airspace/neo4j/Dockerfile}
    environment:
      NEO4J_AUTH: "neo4j/${AIRSPACE_NEO4J_PASSWORD:-garuda-airspace-neo4j-local-only}"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    ports: ["127.0.0.1:${AIRSPACE_NEO4J_BOLT_PORT:-37687}:7687", "127.0.0.1:${AIRSPACE_NEO4J_HTTP_PORT:-37474}:7474"]
    volumes: [neo4j-data:/data, neo4j-logs:/logs]
    healthcheck: {test: [CMD-SHELL, 'cypher-shell -a bolt://localhost:7687 -u neo4j -p "$${NEO4J_AUTH#*/}" "RETURN 1" >/dev/null'], interval: 10s, timeout: 10s, retries: 30, start_period: 30s}
  redpanda:
    platform: linux/amd64
    build: {context: ../.., dockerfile: infra/airspace/redpanda/Dockerfile}
    command: [redpanda, start, --mode=dev-container, --smp=1, --memory=1G, --reserve-memory=0M, "--kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:29092", "--advertise-kafka-addr=internal://redpanda:9092,external://localhost:${AIRSPACE_KAFKA_PORT:-39092}", --rpc-addr=0.0.0.0:33145, --advertise-rpc-addr=redpanda:33145]
    ports: ["127.0.0.1:${AIRSPACE_KAFKA_PORT:-39092}:29092"]
    volumes: [redpanda-data:/var/lib/redpanda/data]
    healthcheck: {test: [CMD, rpk, cluster, health, --exit-when-healthy], interval: 5s, timeout: 10s, retries: 30, start_period: 20s}
  minio:
    platform: linux/amd64
    build: {context: ../.., dockerfile: infra/airspace/minio/Dockerfile}
    environment:
      MINIO_ROOT_USER: "${AIRSPACE_MINIO_ROOT_USER:-garuda-airspace-minio}"
      MINIO_ROOT_PASSWORD: "${AIRSPACE_MINIO_ROOT_PASSWORD:-garuda-airspace-minio-local-only}"
    ports: ["127.0.0.1:${AIRSPACE_MINIO_PORT:-39000}:9000", "127.0.0.1:${AIRSPACE_MINIO_CONSOLE_PORT:-39001}:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: [CMD-SHELL, 'mc alias set local http://127.0.0.1:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null && mc ls local >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
  migrate:
    profiles: [app, test]
    build: {context: ../.., dockerfile: infra/airspace/app/Dockerfile}
    command: [uv, run, alembic, upgrade, head]
    environment: {GARUDA_POSTGRES_DSN: "postgresql://${AIRSPACE_PG_USER:-garuda}:${AIRSPACE_PG_PASSWORD:-garuda-airspace-local-only}@postgres:5432/${AIRSPACE_PG_DATABASE:-garuda_airspace}"}
    depends_on: {postgres: {condition: service_healthy}}
    restart: "no"
  redpanda-init:
    build: {context: ../.., dockerfile: infra/airspace/redpanda/Dockerfile}
    entrypoint: [/bin/sh, /opt/garuda/init-topics.sh]
    depends_on: {redpanda: {condition: service_healthy}}
    restart: "no"
  neo4j-init:
    build: {context: ../.., dockerfile: infra/airspace/neo4j/Dockerfile}
    entrypoint: [/bin/sh, -c, 'cypher-shell -a bolt://neo4j:7687 -u neo4j -p "$$AIRSPACE_NEO4J_PASSWORD" -f /opt/garuda/constraints.cypher']
    environment: {AIRSPACE_NEO4J_PASSWORD: "${AIRSPACE_NEO4J_PASSWORD:-garuda-airspace-neo4j-local-only}"}
    depends_on: {neo4j: {condition: service_healthy}}
    restart: "no"
  minio-init:
    build: {context: ../.., dockerfile: infra/airspace/app/Dockerfile}
    command: [uv, run, python, /opt/garuda/init-bucket.py]
    environment:
      AIRSPACE_MINIO_ENDPOINT: "http://minio:9000"
      AIRSPACE_MINIO_ROOT_USER: "${AIRSPACE_MINIO_ROOT_USER:-garuda-airspace-minio}"
      AIRSPACE_MINIO_ROOT_PASSWORD: "${AIRSPACE_MINIO_ROOT_PASSWORD:-garuda-airspace-minio-local-only}"
    depends_on: {minio: {condition: service_healthy}}
    restart: "no"
  airspace-cli:
    profiles: [app]
    build: {context: ../.., dockerfile: infra/airspace/app/Dockerfile}
    entrypoint: [uv, run, garuda-airspace]
    environment: &appenv
      GARUDA_POSTGRES_DSN: "postgresql://${AIRSPACE_PG_USER:-garuda}:${AIRSPACE_PG_PASSWORD:-garuda-airspace-local-only}@postgres:5432/${AIRSPACE_PG_DATABASE:-garuda_airspace}"
      AIRSPACE_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      AIRSPACE_REDIS_URL: "redis://:${AIRSPACE_REDIS_PASSWORD:-garuda-airspace-redis-local-only}@redis:6379/0"
      AIRSPACE_NEO4J_URI: bolt://neo4j:7687
      AIRSPACE_NEO4J_PASSWORD: ${AIRSPACE_NEO4J_PASSWORD:-garuda-airspace-neo4j-local-only}
    depends_on: {migrate: {condition: service_completed_successfully}, redpanda-init: {condition: service_completed_successfully}, neo4j-init: {condition: service_completed_successfully}, minio-init: {condition: service_completed_successfully}}
  airspace-outbox:
    profiles: [app]
    build: {context: ../.., dockerfile: infra/airspace/app/Dockerfile}
    command: [uv, run, garuda-airspace, worker, outbox, --forever]
    environment: *appenv
    depends_on: {migrate: {condition: service_completed_successfully}, redpanda-init: {condition: service_completed_successfully}}
  airspace-live:
    profiles: [app]
    build: {context: ../.., dockerfile: infra/airspace/app/Dockerfile}
    command: [uv, run, garuda-airspace, worker, live, --forever]
    environment: *appenv
    depends_on: {migrate: {condition: service_completed_successfully}, redpanda-init: {condition: service_completed_successfully}}
  airspace-graph:
    profiles: [app]
    build: {context: ../.., dockerfile: infra/airspace/app/Dockerfile}
    command: [uv, run, garuda-airspace, worker, graph, --forever]
    environment: *appenv
    depends_on: {migrate: {condition: service_completed_successfully}, redpanda-init: {condition: service_completed_successfully}, neo4j-init: {condition: service_completed_successfully}}
  airspace-scheduler:
    profiles: [app]
    build: {context: ../.., dockerfile: infra/airspace/app/Dockerfile}
    command: [uv, run, garuda-airspace, worker, scheduler, --forever]
    environment: *appenv
    depends_on: {migrate: {condition: service_completed_successfully}}
  store-tests:
    profiles: [test]
    build: {context: ../.., dockerfile: infra/airspace/tests/Dockerfile}
    environment:
      GARUDA_AIRSPACE_INTEGRATION: "1"
      AIRSPACE_PG_HOST: postgres
      AIRSPACE_PG_PORT: "5432"
      AIRSPACE_PG_USER: "${AIRSPACE_PG_USER:-garuda}"
      AIRSPACE_PG_PASSWORD: "${AIRSPACE_PG_PASSWORD:-garuda-airspace-local-only}"
      AIRSPACE_PG_DATABASE: "${AIRSPACE_PG_DATABASE:-garuda_airspace}"
      AIRSPACE_REDIS_URL: "redis://:${AIRSPACE_REDIS_PASSWORD:-garuda-airspace-redis-local-only}@redis:6379/0"
      AIRSPACE_NEO4J_URI: "bolt://neo4j:7687"
      AIRSPACE_NEO4J_PASSWORD: "${AIRSPACE_NEO4J_PASSWORD:-garuda-airspace-neo4j-local-only}"
      AIRSPACE_KAFKA_BOOTSTRAP_SERVERS: "redpanda:9092"
      AIRSPACE_MINIO_ENDPOINT: "http://minio:9000"
      AIRSPACE_MINIO_ROOT_USER: "${AIRSPACE_MINIO_ROOT_USER:-garuda-airspace-minio}"
      AIRSPACE_MINIO_ROOT_PASSWORD: "${AIRSPACE_MINIO_ROOT_PASSWORD:-garuda-airspace-minio-local-only}"
    depends_on: {migrate: {condition: service_completed_successfully}, redis: {condition: service_healthy}, neo4j-init: {condition: service_completed_successfully}, redpanda-init: {condition: service_completed_successfully}, minio-init: {condition: service_completed_successfully}}
volumes: {postgres-data: {}, redis-data: {}, neo4j-data: {}, neo4j-logs: {}, redpanda-data: {}, minio-data: {}}
