[project]
name = "garuda"
version = "0.1.0"
description = "GARUDA ADS-B and aircraft availability data layers"
requires-python = ">=3.13"
dependencies = [
  "aiokafka==0.12.0",
  "alembic==1.16.5",
  "asyncpg==0.30.0",
  "boto3==1.40.45",
  "httpx==0.28.1",
  "numpy==2.3.3",
  "neo4j==5.28.2",
  "pydantic==2.11.9",
  "pydantic-settings==2.10.1",
  "PyYAML==6.0.2",
  "psycopg[binary]==3.2.10",
  "redis==6.4.0",
  "simpy==4.1.1",
  "sqlalchemy==2.0.43",
  "pyproj==3.7.2",
  "shapely==2.1.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "confluent-kafka==2.11.1"]

[project.scripts]
garuda-adsb = "backend.app.cli:main"
garuda-aircraft = "backend.app.aircraft_cli:main"
garuda-airspace = "backend.app.airspace_cli:main"
garuda-crew = "backend.app.crew_cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires the isolated Docker airspace services"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
