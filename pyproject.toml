[project]
name = "garuda-adsb"
version = "0.1.0"
description = "GARUDA ADS-B ingestion, replay, and query data layer"
requires-python = ">=3.13"
dependencies = [
  "aiokafka==0.12.0",
  "alembic==1.16.5",
  "asyncpg==0.30.0",
  "boto3==1.40.45",
  "httpx==0.28.1",
  "numpy==2.3.3",
  "pydantic==2.11.9",
  "pydantic-settings==2.10.1",
  "psycopg[binary]==3.2.10",
  "redis==6.4.0",
  "sqlalchemy==2.0.43",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0"]

[project.scripts]
garuda-adsb = "backend.app.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
