[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garuda"
version = "0.1.0"
description = "GARUDA mission data layer"
requires-python = ">=3.11"
dependencies = [
    "aiokafka>=0.11",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "faker>=24",
    "neo4j>=5.26,<6",
    "numpy>=1.26",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pyyaml>=6",
    "redis>=5",
    "shapely>=2.0",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
