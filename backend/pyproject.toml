[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garuda"
version = "0.1.0"
description = "GARUDA mission data layer"
requires-python = ">=3.11"
dependencies = [
    "aiokafka>=0.11",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "faker>=24",
    "neo4j>=5.26,<6",
    "numpy>=1.26",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pyyaml>=6",
    "redis>=5",
    "shapely>=2.0",
    "sqlalchemy>=2.0",
    "boto3>=1.34",
    "httpx>=0.27",
    "pyproj>=3.6",
    "rasterio>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
opt = ["ortools>=9.10", "pulp>=2.8", "highspy>=1.7"]
ml = ["xgboost>=2.0", "lightgbm>=4.3", "scikit-learn>=1.4", "lifelines>=0.28", "shap>=0.45", "pandas>=2.2", "joblib>=1.4", "hdbscan>=0.8"]
moo = ["pymoo>=0.6"]
rl = ["gymnasium>=0.29", "stable-baselines3>=2.3", "sb3-contrib>=2.3", "torch>=2.2", "simpy>=4.1"]
api = ["fastapi>=0.110", "langgraph>=0.2", "langchain-openai>=0.2", "structlog>=24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
