name: garuda

services:
  postgres:
    build:
      context: infra/postgres
    image: garuda-postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-garuda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-garuda}
      POSTGRES_DB: ${POSTGRES_DB:-garuda}
      LLM_RO_PASSWORD: ${LLM_RO_PASSWORD:-llm_ro_dev}
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - timescaledb.telemetry_level=off
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-garuda-dev}
      GARUDA_NEO4J_PASSWORD: ${NEO4J_PASSWORD:-garuda-dev}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -a bolt://localhost:7687 -u neo4j -p \"$$GARUDA_NEO4J_PASSWORD\" 'RETURN 1'",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  neo4j-init:
    image: neo4j:5-community
    profiles: ["init"]
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-garuda-dev}
    volumes:
      - ./infra/neo4j/constraints.cypher:/constraints.cypher:ro
    entrypoint: ["cypher-shell"]
    command:
      - -a
      - bolt://neo4j:7687
      - -u
      - neo4j
      - -p
      - ${NEO4J_PASSWORD:-garuda-dev}
      - -f
      - /constraints.cypher

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.2.4
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level=info
    ports:
      - "19092:19092"
      - "18081:18081"
      - "18082:18082"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 15s
      retries: 30
      start_period: 20s

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v25.2.4
    profiles: ["init"]
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      BROKERS: redpanda:9092
      TOPIC_RETENTION_MS: "604800000"
    volumes:
      - ./infra/redpanda/create_topics.sh:/create_topics.sh:ro
    entrypoint: ["bash", "/create_topics.sh"]

  minio:
    # Official minio/* images were removed from Docker Hub. Chainguard still
    # publishes a MinIO server image; the bucket is created with the AWS CLI.
    image: cgr.dev/chainguard/minio:latest@sha256:4cf4831a2bbcf13ddca09c1cbcc9faff716dd3c4247e0babc32864b8ee8e0034
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-garuda}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-garuda-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/minio", "--version"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio-init:
    image: amazon/aws-cli:2.27.41
    profiles: ["init"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-garuda}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-garuda-secret}
    volumes:
      - ./infra/minio/create_bucket.sh:/create_bucket.sh:ro
    entrypoint: ["/bin/sh", "/create_bucket.sh"]

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
  redpanda_data:
  minio_data:
